[package]
name = "ruststream-lapin"
description = "RabbitMQ / AMQP 0.9.1 broker implementation for the RustStream messaging framework, backed by lapin."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["rabbitmq", "amqp", "messaging", "broker", "ruststream"]
categories = ["asynchronous", "network-programming"]

[lints]
workspace = true

[features]
default = []
# The broker's in-process mode: `TestApp::start` connects `LapinBroker` without a server. A
# service enables it in its dev-dependencies. The conformance harness stays a dev-dependency here:
# it is broker-author tooling, not part of the user-facing testing surface.
testing = ["ruststream/testing"]
# Fills the AMQP protocol bindings of the generated AsyncAPI document. It only forwards the core's
# own feature: without it the document is generated all the same, with nothing RabbitMQ-specific
# in it.
asyncapi = ["ruststream/asyncapi", "dep:serde"]
# TLS backends, mapped 1:1 onto lapin's cargo features.
tls-native-tls = ["lapin/native-tls"]
tls-rustls = ["lapin/rustls"]
tls-rustls-ring = ["lapin/rustls", "lapin/rustls--ring"]
# Typed support for the consistent-hash exchange plugin (server-side hash fan-out). The typed
# constructor lowers to the plugin's exchange type, so the plugin must be enabled on the broker.
plugin-consistent-hash = []
# Delayed-message-exchange plugin backend for `RabbitQueue::delay` (an alternative to the stock
# TTL waiting queue). Needs the plugin enabled on the broker.
plugin-dme = []

[dependencies]
ruststream = { workspace = true }
# Only the AsyncAPI binding bodies are serialized here; a service's own payloads are the codec's
# business, so serde is not a dependency of the transport.
serde = { version = "1", features = ["derive"], optional = true }
lapin = { workspace = true }
arc-swap = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
ruststream = { workspace = true, features = [
    "conformance",
    "testing",
    "macros",
    "json",
    "asyncapi",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { workspace = true }

[package.metadata.docs.rs]
all-features = true

